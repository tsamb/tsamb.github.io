<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Samuel R Blackman</title>
<meta name="robots" content="noindex">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#efece2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14130f">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cstyle%3Erect%7Bfill%3A%23efece2%7Dtext%7Bfill%3A%231b1a17%7D%40media(prefers-color-scheme%3Adark)%7Brect%7Bfill%3A%2314130f%7Dtext%7Bfill%3A%23e6e2d6%7D%7D%3C%2Fstyle%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%2F%3E%3Ctext%20x%3D%2250.00%22%20y%3D%2260.75%22%20text-anchor%3D%22middle%22%20font-family%3D%22'Iowan%20Old%20Style'%2C'Palatino%20Linotype'%2CPalatino%2C'Book%20Antiqua'%2CGeorgia%2C'Times%20New%20Roman'%2CTimes%2Cserif%22%20font-weight%3D%22400%22%20font-size%3D%2232.63%22%20letter-spacing%3D%221.5%22%3ESRB%3C%2Ftext%3E%3C%2Fsvg%3E">
<style>
  :root {
    color-scheme: light dark;
    --stock: #efece2;
    --ink: #1b1a17;
    --rule: #b3ad9d;
    --track: 0.22em;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --stock: #14130f;
      --ink: #e6e2d6;
      --rule: #4b473d;
    }
  }

  html {
    -webkit-text-size-adjust: 100%;
  }

  body {
    box-sizing: border-box;
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
    background: var(--stock);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", Times, serif;
    font-size: clamp(1rem, 2.6vw, 1.125rem);
    line-height: 1.65;
  }

  main {
    width: 100%;
    max-width: 32rem;
    text-align: center;
  }

  h1 {
    margin: 0;
    font-size: clamp(3rem, 13vw, 5.5rem);
    font-weight: 400;
    letter-spacing: var(--track);
    /* Offsets the trailing letter-space so the tracked numerals stay optically centred. */
    padding-left: var(--track);
  }

  /* Engraved hairline, decorative only — no separator announced to screen readers. */
  h1::after {
    content: "";
    display: block;
    width: 3.5rem;
    height: 1px;
    margin: 1.5rem auto 1.7rem;
    background: var(--rule);
  }

  p {
    margin: 0 0 1.1rem;
    text-wrap: pretty;
  }

  /* Each beat of the contemplation sits on its own line. */
  p span {
    display: block;
    text-wrap: balance;
  }

  p:last-child {
    margin-bottom: 0;
  }

  a {
    color: inherit;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.18em;
  }

  a:hover {
    text-decoration-thickness: 2px;
  }

  a:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 3px;
    text-decoration: none;
  }

  @media (max-width: 23rem) {
    body {
      padding-inline: 1rem;
      font-size: 0.9375rem;
    }
  }
</style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>
      <span>This page does not exist.</span>
      <span>Yet here it is, telling you so.</span>
      <span>Presence and absence arise together.</span>
    </p>
    <p>Back to <a href="/">Samuel R Blackman</a>.</p>
  </main>
</body>
</html>
